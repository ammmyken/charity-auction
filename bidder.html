<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>❤️ 部門愛心義賣競標</title>
<style>
  :root {
    --rose-primary: #D15B70;
    --rose-light: #FFE3E7;
    --rose-lighter: #FFF5F6;
    --rose-text-dark: #4A3236;
    --rose-text-muted: #7C6A6D;
    --rose-btn-quick: #E07B8D;
    --rose-btn-buyout: #3D272A;
    --rose-text-buyout: #FFB3C1;
    --rose-border: #E8D4D7;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background-color: var(--rose-lighter);
    color: var(--rose-text-dark);
    margin: 0;
    padding: 16px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
  }
  .header {
    text-align: center;
    margin-bottom: 14px;
  }
  .header h2 {
    margin: 0 0 6px 0;
    font-size: 22px;
    font-weight: 800;
    color: var(--rose-text-dark);
  }
  .conn-dot { font-size: 12px; color: var(--rose-primary); font-weight: 700; }

  .card {
    background: #ffffff;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid var(--rose-border);
    box-shadow: 0 4px 14px rgba(209, 91, 112, 0.06);
  }
  .status-banner {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .banner-live { background: var(--rose-light); color: var(--rose-primary); border: 1px solid var(--rose-border); }
  .banner-sold { background: var(--rose-btn-buyout); color: var(--rose-text-buyout); }

  .item-title { font-size: 22px; font-weight: 800; margin: 4px 0; color: var(--rose-text-dark); }
  .item-desc { font-size: 14px; color: var(--rose-text-muted); margin-bottom: 12px; }

  .price-box {
    background: var(--rose-lighter);
    border: 1.5px solid var(--rose-border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    margin-bottom: 12px;
  }
  .price-label { font-size: 13px; color: var(--rose-primary); font-weight: 700; }
  .price-value { font-size: 38px; font-weight: 900; color: var(--rose-primary); margin: 4px 0; letter-spacing: -0.5px; }
  .leader-info { font-size: 14px; color: var(--rose-text-dark); font-weight: 700; }

  .meta-row {
    display: flex;
    justify-content: space-around;
    font-size: 13px;
    color: var(--rose-text-muted);
    background: var(--rose-lighter);
    padding: 9px;
    border-radius: 10px;
    font-weight: 600;
  }

  label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--rose-text-dark); }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1.5px solid var(--rose-border);
    border-radius: 10px;
    box-sizing: border-box;
    margin-bottom: 12px;
    background: #FFFFFF;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--rose-primary);
    box-shadow: 0 0 0 3px rgba(209, 91, 112, 0.14);
    background: #fff;
    outline: none;
  }

  .btn-base {
    width: 100%;
    padding: 13px 10px;
    border: 1.5px solid var(--rose-btn-quick);
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    background: var(--rose-lighter);
    color: var(--rose-primary);
    margin-bottom: 8px;
    transition: transform 0.1s, background 0.15s;
  }
  .btn-base:active { transform: scale(0.98); background: var(--rose-light); }
  .btn-base:disabled { background: #F5F0F1; border-color: #E0D0D3; color: #A8989B; cursor: not-allowed; }

  .quick-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn-bid {
    padding: 13px 8px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    background: var(--rose-btn-quick);
    color: #fff;
    box-shadow: 0 3px 8px rgba(209, 91, 112, 0.24);
    transition: transform 0.1s, opacity 0.15s;
  }
  .btn-bid:active { transform: scale(0.97); }
  .btn-bid:disabled { background: #D0C0C3; color: #fff; box-shadow: none; cursor: not-allowed; }

  .btn-buyout {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    background: var(--rose-btn-buyout);
    color: var(--rose-text-buyout);
    margin-bottom: 12px;
    box-shadow: 0 4px 10px rgba(61, 39, 42, 0.2);
    transition: transform 0.1s;
  }
  .btn-buyout:active { transform: scale(0.98); }
  .btn-buyout:disabled { background: #D0C0C3; color: #fff; border: none; box-shadow: none; cursor: not-allowed; }

  .custom-row {
    display: flex;
    gap: 8px;
  }
  .custom-row input { margin-bottom: 0; flex: 1; }
  .custom-row button {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: var(--rose-text-dark);
    color: #fff;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
  .custom-row button:disabled { background: #D0C0C3; color: #fff; }

  .history-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 14px;
  }
  .history-list li {
    padding: 9px 0;
    border-bottom: 1px solid var(--rose-border);
    display: flex;
    justify-content: space-between;
  }
  .history-list li:last-child { border-bottom: none; }
  .waiting-screen {
    text-align: center;
    padding: 40px 20px;
    color: var(--rose-text-muted);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>❤️ 部門愛心義賣競標</h2>
    <div id="conn-status" class="conn-dot">⏳ 連線中...</div>
  </div>

  <!-- 你的大名 -->
  <div class="card">
    <label for="bidder-name">👤 你的姓名 / 暱稱（方便得標對帳）</label>
    <input type="text" id="bidder-name" placeholder="請輸入姓名或分機，例如：小美 #123" oninput="saveName()">
  </div>

  <!-- 主競標區 -->
  <div id="auction-area">
    <div class="card waiting-screen">
      <h3>⏳ 等待主持人開啟競標商品...</h3>
      <p>商品切換後畫面會自動更新，不用重新整理！</p>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, onValue, runTransaction, push } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0KOm-4NaSX29Fr_O4ToTvaWqO3B6Gqh8",
    authDomain: "dept-charity-auction.firebaseapp.com",
    databaseURL: "https://dept-charity-auction-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dept-charity-auction",
    storageBucket: "dept-charity-auction.firebasestorage.app",
    messagingSenderId: "487879822103",
    appId: "1:487879822103:web:6cfc3228b4114a27c84552"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let activeItemId = null;
  let currentItem = null;
  let itemUnsubscribe = null;

  const savedName = localStorage.getItem('charity_bidder_name');
  if (savedName) document.getElementById('bidder-name').value = savedName;

  window.saveName = function() {
    localStorage.setItem('charity_bidder_name', document.getElementById('bidder-name').value);
  };

  onValue(ref(db, '.info/connected'), (snap) => {
    const el = document.getElementById('conn-status');
    if (snap.val() === true) {
      el.innerText = '🟢 即時同步連線中';
      el.style.color = '#D15B70';
    } else {
      el.innerText = '🔴 網路不穩，重新連線中...';
      el.style.color = '#dc2626';
    }
  });

  onValue(ref(db, 'auction/activeItemId'), (snap) => {
    const newId = snap.val();
    if (newId === activeItemId) return;
    activeItemId = newId;

    if (itemUnsubscribe) {
      itemUnsubscribe();
      itemUnsubscribe = null;
    }

    if (!activeItemId) {
      currentItem = null;
      renderWaiting();
      return;
    }

    itemUnsubscribe = onValue(ref(db, `auction/items/${activeItemId}`), (itemSnap) => {
      currentItem = itemSnap.val();
      if (!currentItem) {
        renderWaiting();
      } else {
        renderAuction(currentItem);
      }
    });
  });

  function renderWaiting() {
    document.getElementById('auction-area').innerHTML = `
      <div class="card waiting-screen">
        <h3>⏳ 等待主持人開啟下一樣商品...</h3>
        <p>商品開始競標時畫面會自動跳出！</p>
      </div>
    `;
  }

  function renderAuction(item) {
    const isSold = item.status === 'sold';
    const hasBid = item.currentPrice > 0;
    const basePrice = hasBid ? item.currentPrice : item.startPrice;

    const p10 = basePrice + 10;
    const p20 = basePrice + 20;
    const p30 = basePrice + 30;
    const p50 = basePrice + 50;

    const baseBtnHtml = !hasBid
      ? `<button class="btn-base" ${isSold ? 'disabled' : ''} onclick="submitBid(${item.startPrice}, false)">
           🏷️ 出底價 ($${item.startPrice})
         </button>`
      : '';

    const buyoutHtml = item.buyoutPrice
      ? `<button class="btn-buyout" ${isSold ? 'disabled' : ''} onclick="submitBid(${item.buyoutPrice}, true)">
           ⚡ 一口價直接帶走 $${item.buyoutPrice}
         </button>`
      : '';

    let historyHtml = '<p style="color:#A8989B; font-size:13px; text-align:center;">目前還沒有人出價，搶頭香就是你！</p>';
    if (item.bids) {
      const list = Object.values(item.bids).sort((a, b) => b.time - a.time).slice(0, 8);
      historyHtml = `<ul class="history-list">` +
        list.map((b, i) => `
          <li>
            <span>${i === 0 ? '👑 ' : ''}${escapeHtml(b.bidder)} ${b.isBuyout ? '<strong style="color:#D15B70;">[一口價]</strong>' : ''}</span>
            <strong style="color:#D15B70;">$${b.amount}</strong>
          </li>
        `).join('') +
        `</ul>`;
    }

    document.getElementById('auction-area').innerHTML = `
      <div class="card">
        <span class="status-banner ${isSold ? 'banner-sold' : 'banner-live'}">
          ${isSold ? '✅ 已結標成交' : '🔥 現場競標中'}
        </span>
        <div class="item-title">${escapeHtml(item.name)}</div>
        ${item.desc ? `<div class="item-desc">${escapeHtml(item.desc)}</div>` : ''}

        <div class="price-box">
          <div class="price-label">${hasBid ? '目前最高出價' : '起標底價'}</div>
          <div class="price-value">$${hasBid ? item.currentPrice : item.startPrice}</div>
          <div class="leader-info">
            ${hasBid ? `目前領先：${escapeHtml(item.highestBidder)}` : '尚未有人出價'}
          </div>
        </div>

        <div class="meta-row">
          <span>起標價：$${item.startPrice}</span>
          <span>一口價：${item.buyoutPrice ? '$' + item.buyoutPrice : '無'}</span>
        </div>
      </div>

      <div class="card">
        <label>💰 快速出價（點擊立即送出）</label>
        ${baseBtnHtml}
        <div class="quick-grid">
          <button class="btn-bid" ${isSold ? 'disabled' : ''} onclick="submitBid(${p10}, false)">+$10<br><small>($${p10})</small></button>
          <button class="btn-bid" ${isSold ? 'disabled' : ''} onclick="submitBid(${p20}, false)">+$20<br><small>($${p20})</small></button>
          <button class="btn-bid" ${isSold ? 'disabled' : ''} onclick="submitBid(${p30}, false)">+$30<br><small>($${p30})</small></button>
          <button class="btn-bid" ${isSold ? 'disabled' : ''} onclick="submitBid(${p50}, false)">+$50<br><small>($${p50})</small></button>
        </div>

        ${buyoutHtml}

        <label>✍️ 或自訂金額出價</label>
        <div class="custom-row">
          <input type="number" id="custom-amount" placeholder="輸入高於目前價格的金額" ${isSold ? 'disabled' : ''}>
          <button ${isSold ? 'disabled' : ''} onclick="submitCustomBid()">出價</button>
        </div>
      </div>

      <div class="card">
        <label>📜 最新出價紀錄</label>
        ${historyHtml}
      </div>
    `;
  }

  window.submitCustomBid = function() {
    const val = parseInt(document.getElementById('custom-amount').value, 10);
    if (isNaN(val) || val <= 0) {
      alert('請輸入有效的出價金額！');
      return;
    }
    submitBid(val, false);
  };

  window.submitBid = async function(amount, isBuyoutClick) {
    const bidder = document.getElementById('bidder-name').value.trim();
    if (!bidder) {
      alert('請先在最上方輸入你的姓名或暱稱喔！');
      document.getElementById('bidder-name').focus();
      return;
    }
    if (!activeItemId || !currentItem) return;

    const confirmMsg = isBuyoutClick
      ? `確定要以一口價 $${amount} 直接得標「${currentItem.name}」嗎？`
      : `確定要出價 $${amount} 競標「${currentItem.name}」嗎？`;
    if (!confirm(confirmMsg)) return;

    const itemRef = ref(db, `auction/items/${activeItemId}`);
    let errorReason = '';

    try {
      const result = await runTransaction(itemRef, (item) => {
        if (!item) return item;
        if (item.status === 'sold') {
          errorReason = '手慢了一步，此商品剛剛已經結標囉！';
          return;
        }

        const minRequired = item.currentPrice > 0 ? item.currentPrice + 1 : item.startPrice;
        if (amount < minRequired) {
          errorReason = `剛剛已經有人出到 $${item.currentPrice || item.startPrice} 囉！請重新出更高價。`;
          return;
        }

        let finalAmount = amount;
        if (item.buyoutPrice && amount >= item.buyoutPrice) {
          finalAmount = item.buyoutPrice;
          item.status = 'sold';
        }

        item.currentPrice = finalAmount;
        item.highestBidder = bidder;
        return item;
      });

      if (!result.committed) {
        alert(errorReason || '出價未成功，可能剛好有人同時出價，請再試一次！');
        return;
      }

      const finalData = result.snapshot.val();
      await push(ref(db, `auction/items/${activeItemId}/bids`), {
        bidder,
        amount: finalData.currentPrice,
        isBuyout: finalData.status === 'sold' && Boolean(finalData.buyoutPrice && finalData.currentPrice >= finalData.buyoutPrice),
        time: Date.now()
      });

      const customInput = document.getElementById('custom-amount');
      if (customInput) customInput.value = '';

    } catch (e) {
      alert('連線發生錯誤，請檢查網路後再試一次：' + e.message);
    }
  };

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
</script>
</body>
</html>
