<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 義賣主持人後台</title>
<style>
  :root {
    --cube-green: #00A94F;
    --cube-green-dark: #00853E;
    --cube-green-soft: #E6F7EE;
    --cube-green-border: #B8E6CD;
    --cube-text-dark: #1A2421;
    --cube-text-muted: #5C6B64;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background-color: #F3F6F4;
    color: var(--cube-text-dark);
    margin: 0 auto;
    padding: 16px;
    max-width: 900px;
  }
  h2, h3 { margin-top: 0; color: var(--cube-text-dark); }
  .cube-tag {
    display: inline-block;
    background: var(--cube-green);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    vertical-align: middle;
    margin-right: 6px;
    letter-spacing: 0.8px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid #E5ECE8;
    box-shadow: 0 3px 10px rgba(0, 80, 38, 0.05);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .form-group { display: flex; flex-direction: column; }
  label { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--cube-text-muted); }
  input {
    padding: 9px 10px;
    border: 1.5px solid #CBD8D1;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    background: #FAFCFB;
  }
  input:focus {
    border-color: var(--cube-green);
    background: #fff;
    outline: none;
  }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }

  /* CUBE 色系按鈕定義 */
  .btn-primary { background: linear-gradient(135deg, #00B856, #008F42); color: #fff; }
  .btn-success { background: #1E2923; color: #5CE698; border: 1px solid #00A94F; }
  .btn-info { background: var(--cube-green-soft); color: var(--cube-green-dark); border: 1px solid var(--cube-green-border); }
  .btn-warning { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
  .btn-danger { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
  .btn-secondary { background: #E9EFEA; color: #47574F; }

  .item-card {
    border: 1.5px solid #DDE6E1;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    background: #fff;
    transition: all 0.2s;
  }
  .item-card.active-item {
    border-color: var(--cube-green);
    background: #F4FBF7;
    box-shadow: 0 2px 10px rgba(0, 169, 79, 0.12);
  }
  .item-card.sold-item {
    border-color: #CBD5D0;
    background: #F8FAF9;
    opacity: 0.92;
  }
  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
  }
  .badge-active { background: var(--cube-green); color: #fff; }
  .badge-waiting { background: #E9EFEA; color: #5C6B64; }
  .badge-sold { background: #1E2923; color: #5CE698; }

  .price-info {
    font-size: 14px;
    color: var(--cube-text-dark);
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .current-high {
    font-size: 18px;
    font-weight: 900;
    color: var(--cube-green);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .edit-box {
    margin-top: 12px;
    padding: 12px;
    background: #F4F8F6;
    border: 1px solid var(--cube-green-border);
    border-radius: 10px;
  }
  .history-box {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed #CBD8D1;
    font-size: 13px;
    color: var(--cube-text-muted);
    max-height: 110px;
    overflow-y: auto;
  }
  .status-bar {
    font-size: 13px;
    color: var(--cube-green-dark);
    font-weight: 700;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

  <h2><span class="cube-tag">CUBE</span>部門愛心義賣 — 主持人後台</h2>
  <div id="conn-status" class="status-bar">⏳ 連線至即時資料庫中...</div>

  <!-- 新增義賣商品 -->
  <div class="card">
    <h3>➕ 新增義賣商品</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>商品名稱 *</label>
        <input id="item-name" placeholder="例如：星巴克限量保溫杯">
      </div>
      <div class="form-group">
        <label>起標底價 ($) *</label>
        <input id="start-price" type="number" value="100" min="0">
      </div>
      <div class="form-group">
        <label>一口價 ($，選填)</label>
        <input id="buyout-price" type="number" placeholder="不設可留空" min="0">
      </div>
      <div class="form-group">
        <label>補充說明 (選填)</label>
        <input id="item-desc" placeholder="例如：全新未拆、捐贈人小王">
      </div>
    </div>
    <button class="btn btn-primary" onclick="addItem()">新增至清單</button>
  </div>

  <!-- 商品管理與切換區 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
      <h3 style="margin:0;">📦 義賣商品清單（點擊切換現場競標）</h3>
      <button class="btn btn-secondary" onclick="clearActiveItem()">⏸️ 暫停展示（無進行中商品）</button>
    </div>
    <div id="items-container">載入中...</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0KOm-4NaSX29Fr_O4ToTvaWqO3B6Gqh8",
    authDomain: "dept-charity-auction.firebaseapp.com",
    databaseURL: "https://dept-charity-auction-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dept-charity-auction",
    storageBucket: "dept-charity-auction.firebasestorage.app",
    messagingSenderId: "487879822103",
    appId: "1:487879822103:web:6cfc3228b4114a27c84552"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentActiveId = null;
  let allItems = {};
  let editingItemId = null;

  onValue(ref(db, '.info/connected'), (snap) => {
    const el = document.getElementById('conn-status');
    if (snap.val() === true) {
      el.innerText = '🟢 已連線至即時同步伺服器';
      el.style.color = '#00853E';
    } else {
      el.innerText = '🔴 連線中斷，嘗試重新連線中...';
      el.style.color = '#dc2626';
    }
  });

  onValue(ref(db, 'auction/activeItemId'), (snap) => {
    currentActiveId = snap.val();
    renderItems();
  });

  onValue(ref(db, 'auction/items'), (snap) => {
    allItems = snap.val() || {};
    renderItems();
  });

  window.addItem = function() {
    const name = document.getElementById('item-name').value.trim();
    const startPrice = parseInt(document.getElementById('start-price').value, 10);
    const buyoutRaw = document.getElementById('buyout-price').value.trim();
    const buyoutPrice = buyoutRaw ? parseInt(buyoutRaw, 10) : null;
    const desc = document.getElementById('item-desc').value.trim();

    if (!name || isNaN(startPrice) || startPrice < 0) {
      alert('請輸入正確的商品名稱與起標底價！');
      return;
    }
    if (buyoutPrice !== null && (isNaN(buyoutPrice) || buyoutPrice <= startPrice)) {
      alert('一口價必須大於起標底價！');
      return;
    }

    const newItemRef = push(ref(db, 'auction/items'));
    set(newItemRef, {
      name,
      desc,
      startPrice,
      buyoutPrice,
      currentPrice: 0,
      highestBidder: '',
      status: 'open',
      createdAt: Date.now()
    });

    document.getElementById('item-name').value = '';
    document.getElementById('buyout-price').value = '';
    document.getElementById('item-desc').value = '';
  };

  window.startEditItem = function(itemId) {
    editingItemId = (editingItemId === itemId) ? null : itemId;
    renderItems();
  };

  window.saveEditItem = function(itemId) {
    const item = allItems[itemId];
    if (!item) return;

    const name = document.getElementById(`edit-name-${itemId}`).value.trim();
    const startPrice = parseInt(document.getElementById(`edit-start-${itemId}`).value, 10);
    const buyoutRaw = document.getElementById(`edit-buyout-${itemId}`).value.trim();
    const buyoutPrice = buyoutRaw ? parseInt(buyoutRaw, 10) : null;
    const desc = document.getElementById(`edit-desc-${itemId}`).value.trim();

    if (!name || isNaN(startPrice) || startPrice < 0) {
      alert('請輸入正確的商品名稱與起標底價！');
      return;
    }
    if (buyoutPrice !== null && (isNaN(buyoutPrice) || buyoutPrice <= startPrice)) {
      alert('一口價必須大於起標底價！');
      return;
    }
    if (buyoutPrice !== null && item.currentPrice > 0 && buyoutPrice <= item.currentPrice) {
      alert(`目前最高出價已經是 $${item.currentPrice}，新設定的一口價必須高於目前最高價喔！`);
      return;
    }

    update(ref(db, `auction/items/${itemId}`), {
      name,
      startPrice,
      buyoutPrice,
      desc
    }).then(() => {
      editingItemId = null;
      renderItems();
    });
  };

  window.setActiveItem = function(itemId) {
    set(ref(db, 'auction/activeItemId'), itemId);
  };

  window.clearActiveItem = function() {
    set(ref(db, 'auction/activeItemId'), null);
  };

  window.closeItem = function(itemId) {
    if (!confirm('確定要將此商品設為「已結標」嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), { status: 'sold' });
  };

  window.reopenItem = function(itemId) {
    if (!confirm('確定要重新開放此商品競標嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), { status: 'open' });
  };

  window.resetBids = function(itemId) {
    if (!confirm('確定要清空此商品的所有出價紀錄並恢復起標狀態嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), {
      currentPrice: 0,
      highestBidder: '',
      status: 'open',
      bids: null
    });
  };

  window.deleteItem = function(itemId) {
    if (!confirm('確定要永久刪除此商品嗎？')) return;
    if (currentActiveId === itemId) {
      set(ref(db, 'auction/activeItemId'), null);
    }
    if (editingItemId === itemId) {
      editingItemId = null;
    }
    remove(ref(db, `auction/items/${itemId}`));
  };

  function renderItems() {
    const container = document.getElementById('items-container');
    const keys = Object.keys(allItems);

    if (keys.length === 0) {
      container.innerHTML = '<p style="color:#5C6B64;">目前尚未新增任何義賣商品。</p>';
      return;
    }

    container.innerHTML = '';
    keys.forEach((id, idx) => {
      const item = allItems[id];
      const isActive = (id === currentActiveId);
      const isSold = (item.status === 'sold');
      const isEditing = (id === editingItemId);

      let badgeHtml = `<span class="badge badge-waiting">待拍賣</span>`;
      if (isActive && !isSold) badgeHtml = `<span class="badge badge-active">● 現場競標中</span>`;
      if (isSold) badgeHtml = `<span class="badge badge-sold">✅ 已結標</span>`;

      const displayPrice = item.currentPrice > 0 ? `$${item.currentPrice}` : `尚未出價（底價 $${item.startPrice}）`;
      const winnerText = item.highestBidder ? `｜最高出價者：<strong>${escapeHtml(item.highestBidder)}</strong>` : '';
      const buyoutText = item.buyoutPrice ? `｜一口價：<strong>$${item.buyoutPrice}</strong>` : '';

      let bidsHtml = '';
      if (item.bids) {
        const bidList = Object.values(item.bids).sort((a, b) => b.time - a.time);
        bidsHtml = `<div class="history-box"><strong>出價紀錄（共 ${bidList.length} 筆）：</strong><br>` +
          bidList.map(b => `• ${escapeHtml(b.bidder)} 出價 $${b.amount} ${b.isBuyout ? '(一口價!)' : ''}`).join('<br>') +
          `</div>`;
      }

      const editBoxHtml = isEditing ? `
        <div class="edit-box">
          <strong style="display:block; margin-bottom:8px; color:#1A2421;">✏️ 編輯商品資料</strong>
          <div class="form-grid">
            <div class="form-group">
              <label>商品名稱 *</label>
              <input id="edit-name-${id}" value="${escapeAttr(item.name)}">
            </div>
            <div class="form-group">
              <label>起標底價 ($) *</label>
              <input id="edit-start-${id}" type="number" value="${item.startPrice}" min="0">
            </div>
            <div class="form-group">
              <label>一口價 ($，留空取消)</label>
              <input id="edit-buyout-${id}" type="number" value="${item.buyoutPrice ?? ''}" placeholder="不設可留空" min="0">
            </div>
            <div class="form-group">
              <label>補充說明</label>
              <input id="edit-desc-${id}" value="${escapeAttr(item.desc || '')}">
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="saveEditItem('${id}')">💾 儲存修改</button>
            <button class="btn btn-secondary" onclick="startEditItem('${id}')">取消</button>
          </div>
        </div>
      ` : '';

      const card = document.createElement('div');
      card.className = `item-card ${isActive ? 'active-item' : ''} ${isSold ? 'sold-item' : ''}`;
      card.innerHTML = `
        <div class="item-header">
          <div>
            <strong style="font-size:16px;">#${idx + 1} ${escapeHtml(item.name)}</strong>
            ${item.desc ? `<span style="color:#5C6B64; font-size:13px;">（${escapeHtml(item.desc)}）</span>` : ''}
          </div>
          ${badgeHtml}
        </div>
        <div class="price-info">
          底價：$${item.startPrice}${buyoutText}<br>
          目前狀態：<span class="current-high">${displayPrice}</span>${winnerText}
        </div>
        <div class="actions">
          ${!isActive
            ? `<button class="btn btn-primary" onclick="setActiveItem('${id}')">📢 切換為現場競標</button>`
            : `<button class="btn btn-danger" onclick="clearActiveItem()">⏹️ 取消展示</button>`}
          <button class="btn btn-info" onclick="startEditItem('${id}')">✏️ 編輯</button>
          ${!isSold ? `<button class="btn btn-success" onclick="closeItem('${id}')">🔨 立即結標</button>` : `<button class="btn btn-warning" onclick="reopenItem('${id}')">🔄 重新開放</button>`}
          <button class="btn btn-warning" onclick="resetBids('${id}')">🧹 清空出價</button>
          <button class="btn btn-danger" onclick="deleteItem('${id}')">🗑️ 刪除</button>
        </div>
        ${editBoxHtml}
        ${bidsHtml}
      `;
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
