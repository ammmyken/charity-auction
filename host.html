<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎤 義賣主持人後台</title>
<style>
  :root {
    --rose-primary: #D15B70;
    --rose-light: #FFE3E7;
    --rose-lighter: #FFF5F6;
    --rose-text-dark: #4A3236;
    --rose-text-muted: #7C6A6D;
    --rose-btn-quick: #E07B8D;
    --rose-btn-buyout: #3D272A;
    --rose-text-buyout: #FFB3C1;
    --rose-border: #E8D4D7;
    --rose-warn-bg: #FFF0F2;
    --rose-warn-text: #B91C1C;
    --rose-warn-border: #FECACA;
    --paid-bg: #FCE7EC;
    --paid-text: #9D2A42;
    --paid-border: #F5B8C6;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background-color: var(--rose-lighter);
    color: var(--rose-text-dark);
    margin: 0 auto;
    padding: 16px;
    max-width: 900px;
  }
  h2, h3 { margin-top: 0; color: var(--rose-text-dark); }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--rose-border);
    box-shadow: 0 3px 10px rgba(209, 91, 112, 0.05);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px;
  }
  .form-group { display: flex; flex-direction: column; }
  label { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--rose-text-muted); }
  input {
    padding: 9px 10px;
    border: 1.5px solid var(--rose-border);
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    background: #FFFFFF;
  }
  input:focus {
    border-color: var(--rose-primary);
    background: #fff;
    outline: none;
  }
  .btn {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-size: 13px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }

  /* 粉系按鈕定義 */
  .btn-primary { background: var(--rose-btn-quick); color: #fff; }
  .btn-success { background: var(--rose-btn-buyout); color: var(--rose-text-buyout); border: 1px solid var(--rose-primary); }
  .btn-info { background: var(--rose-light); color: var(--rose-primary); border: 1px solid var(--rose-border); }
  .btn-warning { background: var(--rose-light); color: var(--rose-primary); border: 1px solid var(--rose-border); }
  .btn-danger { background: var(--rose-warn-bg); color: var(--rose-warn-text); border: 1px solid var(--rose-warn-border); }
  .btn-secondary { background: var(--rose-lighter); color: var(--rose-text-muted); border: 1px solid var(--rose-border); }
  .btn-passed { background: #F4ECEE; color: #6E585C; border: 1px solid #DEC8CD; }

  /* 收款／取貨狀態按鈕 */
  .btn-unpaid {
    background: #FFF1F2;
    color: #BE123C;
    border: 1.5px solid #FDA4AF;
  }
  .btn-paid {
    background: var(--paid-bg);
    color: var(--paid-text);
    border: 1.5px solid var(--paid-border);
  }
  .btn-unclaimed {
    background: var(--rose-lighter);
    color: var(--rose-text-dark);
    border: 1.5px solid var(--rose-border);
  }
  .btn-claimed {
    background: var(--rose-btn-quick);
    color: #fff;
    border: 1.5px solid var(--rose-btn-quick);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .summary-box {
    background: var(--rose-lighter);
    border: 1px solid var(--rose-border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .summary-label { font-size: 12px; color: var(--rose-text-muted); font-weight: 700; }
  .summary-val { font-size: 20px; font-weight: 900; color: var(--rose-primary); margin-top: 4px; }

  .buyer-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--rose-border);
  }
  .buyer-section-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--rose-text-dark);
    margin-bottom: 10px;
  }
  .buyer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 10px;
  }
  .buyer-card {
    background: #FFF9FA;
    border: 1px solid var(--rose-border);
    border-radius: 10px;
    padding: 12px;
  }
  .buyer-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--rose-text-dark);
  }
  .buyer-total {
    color: var(--rose-primary);
    font-size: 15px;
    font-weight: 900;
  }
  .buyer-items {
    margin: 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--rose-text-muted);
    line-height: 1.6;
  }
  .buyer-status-note {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--rose-text-dark);
  }

  .item-card {
    border: 1.5px solid var(--rose-border);
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 12px;
    background: #fff;
    transition: all 0.2s;
  }
  .item-card.active-item {
    border-color: var(--rose-primary);
    background: var(--rose-lighter);
    box-shadow: 0 2px 10px rgba(209, 91, 112, 0.12);
  }
  .item-card.sold-item {
    border-color: #D0C0C3;
    background: #FBF8F9;
    opacity: 0.96;
  }
  .item-card.passed-item {
    border-color: #DEC8CD;
    background: #FAF6F7;
    opacity: 0.88;
  }
  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  .badge-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .badge {
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
  }
  .badge-active { background: var(--rose-primary); color: #fff; }
  .badge-waiting { background: var(--rose-lighter); color: var(--rose-text-muted); }
  .badge-sold { background: var(--rose-btn-buyout); color: var(--rose-text-buyout); }
  .badge-passed { background: #E9DCE0; color: #6E585C; }
  .badge-unpaid { background: #FFE4E6; color: #BE123C; border: 1px solid #FECDD3; }
  .badge-paid { background: var(--paid-bg); color: var(--paid-text); border: 1px solid var(--paid-border); }
  .badge-unclaimed { background: var(--rose-lighter); color: var(--rose-text-muted); border: 1px solid var(--rose-border); }
  .badge-claimed { background: var(--rose-light); color: var(--rose-primary); border: 1px solid var(--rose-border); }

  .price-info {
    font-size: 14px;
    color: var(--rose-text-dark);
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .current-high {
    font-size: 18px;
    font-weight: 900;
    color: var(--rose-primary);
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .settlement-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--rose-border);
  }
  .edit-box {
    margin-top: 12px;
    padding: 12px;
    background: var(--rose-lighter);
    border: 1px solid var(--rose-border);
    border-radius: 10px;
  }
  .history-box {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--rose-border);
    font-size: 13px;
    color: var(--rose-text-muted);
    max-height: 110px;
    overflow-y: auto;
  }
  .status-bar {
    font-size: 13px;
    color: var(--rose-primary);
    font-weight: 700;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

  <h2>🎤 部門愛心義賣 — 主持人後台</h2>
  <div id="conn-status" class="status-bar">⏳ 連線至即時資料庫中...</div>

  <!-- 收款與取貨對帳總覽 -->
  <div class="card">
    <h3>💰 收款與取貨對帳總覽</h3>
    <div id="settlement-summary" class="summary-grid"></div>
    <div id="buyer-summary" class="buyer-section"></div>
  </div>

  <!-- 新增義賣商品 -->
  <div class="card">
    <h3>➕ 新增義賣商品</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>商品名稱 *</label>
        <input id="item-name" placeholder="例如：星巴克限量保溫杯">
      </div>
      <div class="form-group">
        <label>起標底價 ($) *</label>
        <input id="start-price" type="number" value="100" min="0">
      </div>
      <div class="form-group">
        <label>一口價 ($，選填)</label>
        <input id="buyout-price" type="number" placeholder="不設可留空" min="0">
      </div>
      <div class="form-group">
        <label>補充說明 (選填)</label>
        <input id="item-desc" placeholder="例如：全新未拆、捐贈人小王">
      </div>
    </div>
    <button class="btn btn-primary" onclick="addItem()">新增至清單</button>
  </div>

  <!-- 商品管理與切換區 -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:12px;">
      <h3 style="margin:0;">📦 義賣商品清單（點擊切換現場競標）</h3>
      <button class="btn btn-secondary" onclick="clearActiveItem()">⏸️ 暫停展示（無進行中商品）</button>
    </div>
    <div id="items-container">載入中...</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getDatabase, ref, set, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA0KOm-4NaSX29Fr_O4ToTvaWqO3B6Gqh8",
    authDomain: "dept-charity-auction.firebaseapp.com",
    databaseURL: "https://dept-charity-auction-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dept-charity-auction",
    storageBucket: "dept-charity-auction.firebasestorage.app",
    messagingSenderId: "487879822103",
    appId: "1:487879822103:web:6cfc3228b4114a27c84552"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let currentActiveId = null;
  let allItems = {};
  let editingItemId = null;

  onValue(ref(db, '.info/connected'), (snap) => {
    const el = document.getElementById('conn-status');
    if (snap.val() === true) {
      el.innerText = '🟢 已連線至即時同步伺服器';
      el.style.color = '#D15B70';
    } else {
      el.innerText = '🔴 連線中斷，嘗試重新連線中...';
      el.style.color = '#dc2626';
    }
  });

  onValue(ref(db, 'auction/activeItemId'), (snap) => {
    currentActiveId = snap.val();
    renderItems();
  });

  onValue(ref(db, 'auction/items'), (snap) => {
    allItems = snap.val() || {};
    renderSummary();
    renderItems();
  });

  function hasDealRecord(item) {
    return item.status === 'sold' || item.currentPrice > 0;
  }

  function renderSummary() {
    const summaryEl = document.getElementById('settlement-summary');
    const buyerEl = document.getElementById('buyer-summary');
    const items = Object.values(allItems);
    const dealItems = items.filter(i => hasDealRecord(i));

    let paidAmount = 0;
    let unpaidAmount = 0;
    let unpaidCount = 0;
    let unclaimedCount = 0;

    const buyerMap = new Map();

    dealItems.forEach(item => {
      const amount = item.currentPrice > 0 ? item.currentPrice : item.startPrice;
      const isPaid = Boolean(item.isPaid);
      const isClaimed = Boolean(item.isClaimed);

      if (isPaid) {
        paidAmount += amount;
      } else {
        unpaidAmount += amount;
        unpaidCount += 1;
      }
      if (!isClaimed) {
        unclaimedCount += 1;
      }

      const buyerName = (item.highestBidder || '').trim() || '未填寫得標者';
      if (!buyerMap.has(buyerName)) {
        buyerMap.set(buyerName, {
          name: buyerName,
          totalAmount: 0,
          items: [],
          allPaid: true,
          allClaimed: true
        });
      }
      const entry = buyerMap.get(buyerName);
      entry.totalAmount += amount;
      entry.items.push({
        name: item.name,
        amount,
        isPaid,
        isClaimed
      });
      if (!isPaid) entry.allPaid = false;
      if (!isClaimed) entry.allClaimed = false;
    });

    summaryEl.innerHTML = `
      <div class="summary-box">
        <div class="summary-label">已收款總金額</div>
        <div class="summary-val">$${paidAmount}</div>
      </div>
      <div class="summary-box">
        <div class="summary-label">尚未收款金額</div>
        <div class="summary-val">$${unpaidAmount}</div>
      </div>
      <div class="summary-box">
        <div class="summary-label">尚未給錢筆數</div>
        <div class="summary-val">${unpaidCount} 筆</div>
      </div>
      <div class="summary-box">
        <div class="summary-label">尚未拿走筆數</div>
        <div class="summary-val">${unclaimedCount} 筆</div>
      </div>
    `;

    const buyers = Array.from(buyerMap.values());
    if (buyers.length === 0) {
      buyerEl.innerHTML = `<div class="buyer-section-title">🧾 同人得標明細彙整</div><p style="color:#7C6A6D; font-size:13px; margin:0;">目前尚無得標或出價紀錄。</p>`;
      return;
    }

    buyerEl.innerHTML = `
      <div class="buyer-section-title">🧾 同人得標明細彙整（共 ${buyers.length} 位）</div>
      <div class="buyer-grid">
        ${buyers.map(b => {
          const itemLines = b.items.map(it =>
            `<li>${escapeHtml(it.name)} — <strong>$${it.amount}</strong> ${it.isPaid ? '（已給錢）' : '（未給錢）'}${it.isClaimed ? '（已拿走）' : '（未拿走）'}</li>`
          ).join('');
          const payNote = b.allPaid ? '✅ 款項已全數付清' : '💸 尚有未付款項';
          const claimNote = b.allClaimed ? '🎁 物品已全數領取' : '📦 尚有物品未拿走';
          return `
            <div class="buyer-card">
              <div class="buyer-header">
                <span>👤 ${escapeHtml(b.name)}</span>
                <span class="buyer-total">合計 $${b.totalAmount}</span>
              </div>
              <ul class="buyer-items">${itemLines}</ul>
              <div class="buyer-status-note">${payNote}｜${claimNote}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  window.addItem = function() {
    const name = document.getElementById('item-name').value.trim();
    const startPrice = parseInt(document.getElementById('start-price').value, 10);
    const buyoutRaw = document.getElementById('buyout-price').value.trim();
    const buyoutPrice = buyoutRaw ? parseInt(buyoutRaw, 10) : null;
    const desc = document.getElementById('item-desc').value.trim();

    if (!name || isNaN(startPrice) || startPrice < 0) {
      alert('請輸入正確的商品名稱與起標底價！');
      return;
    }
    if (buyoutPrice !== null && (isNaN(buyoutPrice) || buyoutPrice <= startPrice)) {
      alert('一口價必須大於起標底價！');
      return;
    }

    const newItemRef = push(ref(db, 'auction/items'));
    set(newItemRef, {
      name,
      desc,
      startPrice,
      buyoutPrice,
      currentPrice: 0,
      highestBidder: '',
      status: 'open',
      isPaid: false,
      isClaimed: false,
      createdAt: Date.now()
    });

    document.getElementById('item-name').value = '';
    document.getElementById('buyout-price').value = '';
    document.getElementById('item-desc').value = '';
  };

  window.togglePaid = function(itemId) {
    const item = allItems[itemId];
    if (!item || !hasDealRecord(item)) return;
    update(ref(db, `auction/items/${itemId}`), { isPaid: !Boolean(item.isPaid) });
  };

  window.toggleClaimed = function(itemId) {
    const item = allItems[itemId];
    if (!item || !hasDealRecord(item)) return;
    update(ref(db, `auction/items/${itemId}`), { isClaimed: !Boolean(item.isClaimed) });
  };

  window.startEditItem = function(itemId) {
    editingItemId = (editingItemId === itemId) ? null : itemId;
    renderItems();
  };

  window.saveEditItem = function(itemId) {
    const item = allItems[itemId];
    if (!item) return;

    const name = document.getElementById(`edit-name-${itemId}`).value.trim();
    const startPrice = parseInt(document.getElementById(`edit-start-${itemId}`).value, 10);
    const buyoutRaw = document.getElementById(`edit-buyout-${itemId}`).value.trim();
    const buyoutPrice = buyoutRaw ? parseInt(buyoutRaw, 10) : null;
    const desc = document.getElementById(`edit-desc-${itemId}`).value.trim();

    if (!name || isNaN(startPrice) || startPrice < 0) {
      alert('請輸入正確的商品名稱與起標底價！');
      return;
    }
    if (buyoutPrice !== null && (isNaN(buyoutPrice) || buyoutPrice <= startPrice)) {
      alert('一口價必須大於起標底價！');
      return;
    }
    if (buyoutPrice !== null && item.currentPrice > 0 && buyoutPrice <= item.currentPrice) {
      alert(`目前最高出價已經是 $${item.currentPrice}，新設定的一口價必須高於目前最高價喔！`);
      return;
    }

    update(ref(db, `auction/items/${itemId}`), {
      name,
      startPrice,
      buyoutPrice,
      desc
    }).then(() => {
      editingItemId = null;
      renderItems();
    });
  };

  window.setActiveItem = function(itemId) {
    set(ref(db, 'auction/activeItemId'), itemId);
  };

  window.clearActiveItem = function() {
    set(ref(db, 'auction/activeItemId'), null);
  };

  window.closeItem = function(itemId) {
    if (!confirm('確定要將此商品設為「已結標」嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), { status: 'sold' });
  };

  window.passItem = function(itemId) {
    if (!confirm('確定要將此商品設為「流標」嗎？')) return;
    if (currentActiveId === itemId) {
      set(ref(db, 'auction/activeItemId'), null);
    }
    update(ref(db, `auction/items/${itemId}`), {
      status: 'passed',
      isPaid: false,
      isClaimed: false
    });
  };

  window.reopenItem = function(itemId) {
    if (!confirm('確定要重新開放此商品競標嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), { status: 'open' });
  };

  window.resetBids = function(itemId) {
    if (!confirm('確定要清空此商品的所有出價紀錄並恢復起標狀態嗎？')) return;
    update(ref(db, `auction/items/${itemId}`), {
      currentPrice: 0,
      highestBidder: '',
      status: 'open',
      isPaid: false,
      isClaimed: false,
      bids: null
    });
  };

  window.deleteItem = function(itemId) {
    if (!confirm('確定要永久刪除此商品嗎？')) return;
    if (currentActiveId === itemId) {
      set(ref(db, 'auction/activeItemId'), null);
    }
    if (editingItemId === itemId) {
      editingItemId = null;
    }
    remove(ref(db, `auction/items/${itemId}`));
  };

  function renderItems() {
    const container = document.getElementById('items-container');
    const keys = Object.keys(allItems);

    if (keys.length === 0) {
      container.innerHTML = '<p style="color:#7C6A6D;">目前尚未新增任何義賣商品。</p>';
      return;
    }

    container.innerHTML = '';
    keys.forEach((id, idx) => {
      const item = allItems[id];
      const isActive = (id === currentActiveId);
      const isSold = (item.status === 'sold');
      const isPassed = (item.status === 'passed');
      const isEditing = (id === editingItemId);
      const showSettlement = hasDealRecord(item);
      const isPaid = Boolean(item.isPaid);
      const isClaimed = Boolean(item.isClaimed);

      let statusBadgeHtml = `<span class="badge badge-waiting">待拍賣</span>`;
      if (isSold) {
        statusBadgeHtml = `<span class="badge badge-sold">✅ 已結標</span>`;
      } else if (isPassed) {
        statusBadgeHtml = `<span class="badge badge-passed">🏳️ 流標</span>`;
      } else if (isActive) {
        statusBadgeHtml = `<span class="badge badge-active">🔥 現場競標中</span>`;
      }

      const paidBadgeHtml = showSettlement
        ? (isPaid
            ? `<span class="badge badge-paid">💵 已給錢</span>`
            : `<span class="badge badge-unpaid">💸 還沒給錢</span>`)
        : '';

      const claimedBadgeHtml = showSettlement
        ? (isClaimed
            ? `<span class="badge badge-claimed">🎁 已拿走</span>`
            : `<span class="badge badge-unclaimed">📦 還沒拿走</span>`)
        : '';

      const displayPrice = item.currentPrice > 0
        ? `$${item.currentPrice}`
        : (isPassed ? `流標（底價 $${item.startPrice}）` : `尚未出價（底價 $${item.startPrice}）`);
      const winnerText = item.highestBidder ? `｜最高出價者：<strong>${escapeHtml(item.highestBidder)}</strong>` : '';
      const buyoutText = item.buyoutPrice ? `｜一口價：<strong>$${item.buyoutPrice}</strong>` : '';

      let bidsHtml = '';
      if (item.bids) {
        const bidList = Object.values(item.bids).sort((a, b) => b.time - a.time);
        bidsHtml = `<div class="history-box"><strong>出價紀錄（共 ${bidList.length} 筆）：</strong><br>` +
          bidList.map(b => `• ${escapeHtml(b.bidder)} 出價 $${b.amount} ${b.isBuyout ? '(一口價!)' : ''}`).join('<br>') +
          `</div>`;
      }

      const editBoxHtml = isEditing ? `
        <div class="edit-box">
          <strong style="display:block; margin-bottom:8px; color:#4A3236;">✏️ 編輯商品資料</strong>
          <div class="form-grid">
            <div class="form-group">
              <label>商品名稱 *</label>
              <input id="edit-name-${id}" value="${escapeAttr(item.name)}">
            </div>
            <div class="form-group">
              <label>起標底價 ($) *</label>
              <input id="edit-start-${id}" type="number" value="${item.startPrice}" min="0">
            </div>
            <div class="form-group">
              <label>一口價 ($，留空取消)</label>
              <input id="edit-buyout-${id}" type="number" value="${item.buyoutPrice ?? ''}" placeholder="不設可留空" min="0">
            </div>
            <div class="form-group">
              <label>補充說明</label>
              <input id="edit-desc-${id}" value="${escapeAttr(item.desc || '')}">
            </div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="saveEditItem('${id}')">💾 儲存修改</button>
            <button class="btn btn-secondary" onclick="startEditItem('${id}')">取消</button>
          </div>
        </div>
      ` : '';

      const settlementBarHtml = showSettlement ? `
        <div class="settlement-bar">
          <button class="btn ${isPaid ? 'btn-paid' : 'btn-unpaid'}" onclick="togglePaid('${id}')">
            ${isPaid ? '✅ 已給錢（點此改為未給）' : '💸 標記已給錢'}
          </button>
          <button class="btn ${isClaimed ? 'btn-claimed' : 'btn-unclaimed'}" onclick="toggleClaimed('${id}')">
            ${isClaimed ? '🎁 已拿走（點此改為未拿）' : '📦 標記已拿走'}
          </button>
        </div>
      ` : '';

      const card = document.createElement('div');
      card.className = `item-card ${isActive ? 'active-item' : ''} ${isSold ? 'sold-item' : ''} ${isPassed ? 'passed-item' : ''}`;
      card.innerHTML = `
        <div class="item-header">
          <div>
            <strong style="font-size:16px;">#${idx + 1} ${escapeHtml(item.name)}</strong>
            ${item.desc ? `<span style="color:#7C6A6D; font-size:13px;">（${escapeHtml(item.desc)}）</span>` : ''}
          </div>
          <div class="badge-group">
            ${statusBadgeHtml}
            ${paidBadgeHtml}
            ${claimedBadgeHtml}
          </div>
        </div>
        <div class="price-info">
          底價：$${item.startPrice}${buyoutText}<br>
          目前狀態：<span class="current-high">${displayPrice}</span>${winnerText}
        </div>
        <div class="actions">
          ${!isActive
            ? `<button class="btn btn-primary" onclick="setActiveItem('${id}')">📢 切換為現場競標</button>`
            : `<button class="btn btn-danger" onclick="clearActiveItem()">⏹️ 取消展示</button>`}
          <button class="btn btn-info" onclick="startEditItem('${id}')">✏️ 編輯</button>
          ${!isSold ? `<button class="btn btn-success" onclick="closeItem('${id}')">🔨 立即結標</button>` : `<button class="btn btn-warning" onclick="reopenItem('${id}')">🔄 重新開放</button>`}
          ${!isPassed && !isSold ? `<button class="btn btn-passed" onclick="passItem('${id}')">🏳️ 流標</button>` : (isPassed ? `<button class="btn btn-warning" onclick="reopenItem('${id}')">🔄 重新開放</button>` : '')}
          <button class="btn btn-warning" onclick="resetBids('${id}')">🧹 清空出價</button>
          <button class="btn btn-danger" onclick="deleteItem('${id}')">🗑️ 刪除</button>
        </div>
        ${settlementBarHtml}
        ${editBoxHtml}
        ${bidsHtml}
      `;
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
